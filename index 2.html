<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17111A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Our Space">
<meta name="robots" content="noindex, nofollow">
<title>Our Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235A2E63'/%3E%3Ccircle cx='38' cy='50' r='24' fill='%23E8791E'/%3E%3Ccircle cx='62' cy='50' r='24' fill='%23CFA2DA' fill-opacity='.85'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2F7; --surface:#FFFFFF; --surface-2:#ECE7F1; --ink:#2A1830; --muted:#6B5F72; --line:#E1DAE6;
  --plum:#5A2E63; --plum-ink:#FFFFFF; --orange:#C95F14; --orange-ink:#FFFFFF; --orange-tint:#FBEADC;
  --green:#2F7A6B; --danger:#A93A33;
  --r-lg:24px; --r:14px; --pill:999px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17111A; --surface:#221A26; --surface-2:#2C2231; --ink:#F2EBF4; --muted:#AE9FB5; --line:#3A2E40;
    --plum:#CFA2DA; --plum-ink:#1E1222; --orange:#F0A050; --orange-ink:#22140A; --orange-tint:#3A2618;
    --green:#6CC0AD; --danger:#EE8C82; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17111A; --surface:#221A26; --surface-2:#2C2231; --ink:#F2EBF4; --muted:#AE9FB5; --line:#3A2E40;
  --plum:#CFA2DA; --plum-ink:#1E1222; --orange:#F0A050; --orange-ink:#22140A; --orange-tint:#3A2618;
  --green:#6CC0AD; --danger:#EE8C82; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.app{max-width:560px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:'Young Serif',Georgia,'Times New Roman',serif;font-weight:400;margin:0;letter-spacing:-.005em}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Twin skies */
.skies{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.sky{padding:16px 16px 18px;min-height:184px;display:flex;flex-direction:column;transition:background 1.2s ease,color 1.2s ease}
.sky-city{font-size:14px;opacity:.88}
.sky-time{font-family:'Young Serif',Georgia,serif;font-size:clamp(30px,9.5vw,46px);line-height:1.08;margin-top:2px;font-variant-numeric:lining-nums}
.sky-name{font-weight:700;font-size:17px;margin-top:auto;padding-top:14px}
.sky-status{font-size:14px;opacity:.94;line-height:1.35;min-height:2.7em}
.bridge{grid-column:1 / -1;padding:12px 16px;font-size:15px;border-top:1px solid var(--line);background:var(--surface)}
.bridge.paused{background:var(--orange-tint)}
.bridge strong{font-weight:700}

/* Tabs */
.tabs{display:flex;gap:4px;margin:18px 0 6px;background:var(--surface-2);padding:4px;border-radius:var(--pill)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:9px 4px;border-radius:var(--pill);cursor:pointer;min-width:0}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,8,24,.08)}

.notice{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);font-size:14px}

/* Blocks */
.block{padding:22px 0 4px}
.block + .block{border-top:1px solid var(--line);margin-top:18px}
.block > h2{margin-bottom:6px}
.block > .lead{color:var(--muted);margin-bottom:14px;font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.label{font-weight:600;font-size:14px;margin-bottom:6px;display:block}

.pause-panel{border-radius:var(--r-lg);padding:18px;background:var(--surface);border:1px solid var(--line)}
.pause-panel.active{background:var(--orange-tint);border-color:transparent}
.pause-panel h2{margin-bottom:6px}
.quote{border-left:3px solid var(--orange);padding:4px 0 4px 12px;margin:10px 0;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:8px 13px;border-radius:var(--pill);cursor:pointer;line-height:1.25}
.chip[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink);border-color:var(--plum)}
.field{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
select.field{appearance:auto}
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid transparent;border-radius:var(--pill);padding:11px 18px;cursor:pointer;background:var(--plum);color:var(--plum-ink)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.pause{background:var(--orange);color:var(--orange-ink)}
.btn.small{padding:7px 13px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--plum);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.partner{padding:16px 0 0}
.hint{margin-top:8px;font-size:15px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:var(--pill);background:var(--surface-2);color:var(--ink)}
.tag.warn{background:var(--orange-tint);color:var(--ink)}
.tag.good{background:color-mix(in srgb,var(--green) 18%,var(--surface));}

.feed{list-style:none;margin:8px 0 0;padding:0}
.feed > li{padding:14px 0;border-bottom:1px solid var(--line)}
.feed > li:last-child{border-bottom:0}
.meta{font-size:13px;color:var(--muted);margin-bottom:3px}
.appr-text{font-size:17px;line-height:1.45}
.mine-to .appr-text{font-family:'Young Serif',Georgia,serif}
.empty{padding:18px 0;color:var(--muted);font-size:15px}

.stat-line{font-size:15px;margin:2px 0 10px}

.steps{counter-reset:none}
.step-card{border-radius:var(--r-lg);padding:18px;background:var(--surface);border:1px solid var(--line)}
.step-count{font-size:13px;color:var(--muted);margin-bottom:6px}
.step-card ul{margin:10px 0 0;padding-left:20px}
.step-card li{margin:4px 0}
.say{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.say b{font-weight:700}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
.details-block details:first-child{border-top:0}
summary{cursor:pointer;font-weight:600}
.swap{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.swap-wrap{overflow-x:auto}
.swap th,.swap td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.swap th{font-weight:600;color:var(--muted)}
details ol{margin:10px 0 0;padding-left:20px}
details li{margin:4px 0}

.talk-log dl{margin:6px 0 0;display:grid;grid-template-columns:1fr;gap:6px}
.talk-log dt{font-size:13px;color:var(--muted)}
.talk-log dd{margin:0 0 4px}

.footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--pill);padding:3px;gap:2px;vertical-align:middle}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:var(--pill);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;text-align:center}
.toast.show{opacity:1}

.overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:30;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.picker{max-width:380px;width:100%;text-align:left}
.picker h1{font-size:34px;line-height:1.1;margin-bottom:10px}
.picker .btn{width:100%;margin-top:10px;padding:14px 18px;font-size:16px}
.picker .btn.alt{background:var(--orange);color:var(--orange-ink)}

@media (max-width:380px){ .tab{font-size:13px} .sky{padding:14px 12px 16px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* spaces */
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.space-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px 16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.space-card:hover{border-color:var(--plum)}
.space-name{font-family:'Young Serif',Georgia,serif;font-size:22px;line-height:1.2}
.space-sub{font-size:14px;color:var(--muted)}
.space-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:20px}
.space-head h2{font-size:26px}
.tips{list-style:none;padding:0;margin:6px 0 0}
.tips li{position:relative;padding:11px 0 11px 20px;border-bottom:1px solid var(--line);font-size:16px}
.tips li:last-child{border-bottom:0}
.tips li::before{content:'';position:absolute;left:2px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--orange)}
.tips li.now::before{background:var(--plum)}
.pin-wrap{max-width:340px;margin:30px auto 0}
.pin-wrap h2{margin-bottom:6px}
.pin-input{font-size:26px;letter-spacing:.35em;text-align:center}
.err{color:var(--danger);font-size:14px;min-height:1.4em;margin-top:8px}
.code{font-family:'Young Serif',Georgia,serif;font-size:22px;padding:14px;border-radius:var(--r);background:var(--surface-2);text-align:center;word-break:break-word;margin:14px 0}
.today-line{padding:12px 0;border-bottom:1px solid var(--line)}
.today-line:last-child{border-bottom:0}
.today-line .who{font-weight:700;margin-right:6px}
.note-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.note-item p{white-space:pre-wrap}
.lock-hint{font-size:13px;color:var(--muted)}

.tabs[hidden]{display:none}
.space-head .row{flex-wrap:nowrap}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav{display:flex;gap:6px}
.cal-nav .btn{padding:6px 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal-day{aspect-ratio:1 / 1.08;border:0;background:var(--surface);border-radius:12px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;min-width:0}
.cal-day.out{background:transparent;cursor:default}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--plum)}
.cal-day.anniv{background:var(--orange-tint)}
.cal-day[aria-pressed="true"]{background:var(--plum);color:var(--plum-ink);box-shadow:none}
.cal-num{font-size:15px;font-weight:600;line-height:1}
.cal-marks{display:flex;gap:3px;height:9px;align-items:center}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--plum)}
.cal-day[aria-pressed="true"] .cal-dot{background:var(--plum-ink)}
.cal-heart{color:var(--orange);font-size:11px;line-height:1}
.cal-heart.big{font-size:15px}
.cal-day[aria-pressed="true"] .cal-heart{color:var(--orange-tint)}
.ev{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:17px;font-weight:600}
.ev-when{min-width:74px;font-size:13px;font-weight:600;color:var(--muted);padding-top:3px}
.lock{font-size:13px;color:var(--muted);margin-top:2px}
.tab{font-size:13.5px}
@media (max-width:380px){ .tab{font-size:12.5px;padding:9px 2px} }
.tab{flex:1 1 auto;padding:9px 8px;font-size:13.5px}
@media (max-width:380px){ .tab{font-size:12.5px;padding:9px 5px} }

/* boxed messages */
:root{--tint-sudipt:#FBE1CC;--tint-nayana:#E6DBF3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tint-sudipt:#4A3120;--tint-nayana:#382A4D}}
:root[data-theme="dark"]{--tint-sudipt:#4A3120;--tint-nayana:#382A4D}
.bubble{border-radius:16px;padding:11px 15px;margin:10px 0 0;font-size:15px;line-height:1.45;background:var(--tint-sudipt);color:var(--ink);white-space:pre-wrap}
.bubble.from-nayana{background:var(--tint-nayana)}
.pause-panel .bubble{background:var(--surface)}
.feed.jar{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.feed.jar > li{border:0;border-radius:22px;padding:16px 18px 18px;background:var(--tint-sudipt)}
.feed.jar > li.from-nayana{background:var(--tint-nayana)}
.feed.jar .meta{color:var(--ink);opacity:.72;font-weight:600}
.feed.jar .appr-text{font-family:'Young Serif',Georgia,serif;font-size:19px;line-height:1.4;margin-top:4px}
.feed.boxed{display:flex;flex-direction:column;gap:10px}
.feed.boxed > li{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface)}
.feed.boxed > li:last-child{border-bottom:1px solid var(--line)}

/* phone refinements */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:15px;line-height:1.5}
.app{padding:12px max(14px, env(safe-area-inset-right, 0px)) 48px max(14px, env(safe-area-inset-left, 0px))}
h2{font-size:20px;line-height:1.25}
h3{font-size:16.5px}
.block{padding:18px 0 2px}
.block + .block{margin-top:14px}
.block > .lead{font-size:14px;margin-bottom:12px}
.label{font-size:13px}
.chip{font-size:13.5px;padding:7px 12px}
.btn{font-size:14.5px;padding:10px 17px}
.btn.small{font-size:13.5px;padding:6px 12px}
.field,select.field,textarea.field{font-size:16px}
.tips li{font-size:15px;padding:9px 0 9px 18px}
.tips li::before{top:17px;width:7px;height:7px}
.appr-text{font-size:16px}
.feed.jar .appr-text{font-size:17px}
.ev-title{font-size:15.5px}
.ev-when{min-width:70px;font-size:12.5px}
.space-card{padding:14px}
.space-name{font-size:19px}
.space-head{align-items:center;margin-top:16px}
.space-head h2{font-size:22px}
.pause-panel{padding:16px}
.pause-panel h2{font-size:19px}
.step-card{padding:16px}
.picker h1{font-size:30px}
.code{font-size:19px}
.quote,.bubble,.say{font-size:14.5px}
.notice{font-size:13.5px;padding:9px 13px}
.footer{font-size:13.5px}
.code,.bubble,.appr-text,.note-item p,.footer,.ev-title,.feed p{overflow-wrap:anywhere}

/* top panel */
.sky{min-height:148px;padding:14px 14px 15px}
.sky-city{font-size:13px}
.sky-time{font-size:clamp(26px, 8.4vw, 36px);white-space:nowrap;line-height:1.05;margin-top:4px}
.sky-time .ampm{font-size:.46em;margin-left:.2em;opacity:.85}
.sky-name{font-size:15.5px;padding-top:12px}
.sky-status{font-size:13px;min-height:2.6em}
.bridge{font-size:14px;padding:11px 14px}
.skies.compact .sky{min-height:0;padding:10px 14px 12px}
.skies.compact .sky-time{font-size:24px}
.skies.compact .sky-name{padding-top:2px;font-size:14px}
.skies.compact .sky-status{display:none}

/* tabs never cut off: they scroll sideways if the screen is very narrow */
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:14px 0 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font-size:13.5px;padding:8px 10px}

/* calendar */
.cal-head{flex-wrap:wrap}
.cal-head h2{font-size:20px}
.cal-num{font-size:14px}
.cal-day{border-radius:10px}

/* iPhone date and time pickers */
input[type="date"].field,input[type="time"].field,input[type="datetime-local"].field{-webkit-appearance:none;appearance:none;min-height:46px;display:block;min-width:0;text-align:left;line-height:1.3}
input::-webkit-date-and-time-value{text-align:left}
</style>
</head>

</div>

(function(){

const ZONES = { milan:'Europe/Rome', kochi:'Asia/Kolkata' };

const STARTERS = ['I loved how you ', 'Thank you for ', 'You looked so ', 'I felt close to you when ', 'I\u2019m proud of you for '];
const SWAPS = [
  ['\u201cYou always\u201d / \u201cyou never\u201d', '\u201cWhen ___ happened, I felt ___.\u201d'],

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(3)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const nowISO = () => new Date().toISOString();
function other(p){ return p === 'sudipt' ? 'nayana' : 'sudipt'; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function cityOf(p){ return p === 'sudipt' ? 'milan' : (state.settings.nayanaCity === 'milan' ? 'milan' : 'kochi'); }
function tzOf(p){ return ZONES[cityOf(p)]; }
function sameCity(){ return cityOf('sudipt') === cityOf('nayana'); }
function pad(n){ return String(n).padStart(2,'0'); }
function parts(date, tz){
  const f = new Intl.DateTimeFormat('en-US',{timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23', weekday:'short'});
  const o = {}; for (const x of f.formatToParts(date)) o[x.type] = x.value;
  return { y:+o.year, m:+o.month, d:+o.day, h:(+o.hour)%24, mi:+o.minute, s:+o.second, wd:o.weekday };
}
function tzOffsetMin(tz, date){
  const p = parts(date, tz);
  return Math.round((Date.UTC(p.y,p.m-1,p.d,p.h,p.mi,p.s) - date.getTime())/60000);
}
function zonedAt(tz, dayOffset, hour, minute){
  const now = new Date(); const p = parts(now, tz); const off = tzOffsetMin(tz, now);
  return new Date(Date.UTC(p.y, p.m-1, p.d + dayOffset, hour, minute||0) - off*60000);
}
function dateKey(tz, date){ const p = parts(date || new Date(), tz); return p.y + '-' + pad(p.m) + '-' + pad(p.d); }
function clock(date, tz){ return new Intl.DateTimeFormat('en-GB',{timeZone:tz, hour:'numeric', minute:'2-digit', hour12:true}).format(date).replace(/\s?([ap])\.?m\.?/i,' $1m'); }
function whenIn(iso, tz){
  const d = new Date(iso); const t = clock(d, tz);
  const k = dateKey(tz, d), today = dateKey(tz), tom = dateKey(tz, new Date(Date.now()+864e5));
  if (k === today) return t;
  if (k === tom) return 'tomorrow ' + t;
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz, weekday:'short'}).format(d) + ' ' + t;
}
function ago(iso){
  const s = (Date.now() - Date.parse(iso))/1000;
  if (!isFinite(s)) return '';
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + ' min ago';
  if (s < 86400) return Math.floor(s/3600) + ' h ago';
  if (s < 172800) return 'yesterday';
  return new Intl.DateTimeFormat('en-GB',{day:'numeric', month:'short'}).format(new Date(iso));
}
/* a time as `viewer` should read it; with no viewer, both cities */
function dualFor(iso, owner, viewer){
  const t1 = tzOf(owner);
  if (sameCity()) return whenIn(iso, t1);
  if (viewer){
    const t2 = tzOf(viewer);
    if (t1 === t2) return whenIn(iso, t1);
    return whenIn(iso, t1) + ' ' + PEOPLE[owner].his + ' time (' + whenIn(iso, t2) + ' yours)';
  }
  const o = other(owner);
  return whenIn(iso, t1) + ' in ' + CITY_NAME[cityOf(owner)] + ' (' + whenIn(iso, tzOf(o)) + ' in ' + CITY_NAME[cityOf(o)] + ')';
}

/* ---------- crypto ---------- */
function b64e(u8){ let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
function b64d(s){ const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function normCode(c){ return String(c || '').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
async function spaceId(code){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('our-space|' + normCode(code)));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,'0')).join('').slice(0, 40);
}
function genCode(){
  const r = crypto.getRandomValues(new Uint32Array(5));
  const w = i => WORDS[r[i] % WORDS.length];
  return w(0) + '-' + w(1) + '-' + w(2) + '-' + w(3) + '-' + String(1000 + (r[4] % 9000));
}
async function derive(pin, saltB64){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:b64d(saltB64), iterations:150000, hash:'SHA-256' }, base, 512));
  const key = await crypto.subtle.importKey('raw', bits.slice(32), 'AES-GCM', false, ['encrypt','decrypt']);
  return { verifier:b64e(bits.slice(0, 32)), key };
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
  return { iv:b64e(iv), ct:b64e(ct) };
}
async function decryptJSON(key, rec){
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(rec.iv) }, key, b64d(rec.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- storage ---------- */
function deepMerge(a, b){
  const out = Object.assign({}, a);
  for (const k in b){
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) out[k] = deepMerge(a[k], b[k]);
    else out[k] = b[k];
  }
  return out;
}
function localStore(sid){
  const KEY = 'our-space-data-' + sid;
  let data = { docs:{} };
  try{ const raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw) || data; }catch(e){}
  if (!data.docs) data.docs = {};
  const subs = new Set();
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} subs.forEach(f=>f()); };
  const mint = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  return {
    local:true,
    async setDoc(p, v){ data.docs[p] = JSON.parse(JSON.stringify(v)); save(); },
    async updateDoc(p, v){ data.docs[p] = deepMerge(data.docs[p] || {}, v); save(); },
    async getDoc(p){ return data.docs[p] ? JSON.parse(JSON.stringify(data.docs[p])) : null; },
    async addDoc(c, v){ const id = mint(); data.docs[c + '/' + id] = JSON.parse(JSON.stringify(v)); save(); return id; },
    async deleteDoc(p){ delete data.docs[p]; save(); },
    watchDoc(p, cb){ const f = () => cb(data.docs[p] || null); subs.add(f); f(); return () => subs.delete(f); },
    watchColl(c, field, n, cb){
      const f = () => {
        const pre = c + '/';
        const rows = Object.keys(data.docs).filter(k => k.indexOf(pre) === 0 && k.slice(pre.length).indexOf('/') < 0)
          .map(k => Object.assign({ id:k.slice(pre.length) }, data.docs[k]));
        rows.sort((a,b) => String(b[field]||'').localeCompare(String(a[field]||'')));
        cb(rows.slice(0, n));
      };
      subs.add(f); f(); return () => subs.delete(f);
    }
  };
}
function fsStore(fs, sid){
  const base = 'spaces/' + sid + '/';
  const onErr = e => {
    if (e && e.code === 'permission-denied') state.connErr = 'Couldn\u2019t reach your space. Check the database rules in the setup notes.';
    else state.connErr = 'Connection problem. Changes will sync when you\u2019re back online.';
    renderNotices();
  };
  return {
    local:false,
    setDoc:(p, v) => fs.doc(base + p).set(v),
    updateDoc:(p, v) => fs.doc(base + p).set(v, { merge:true }),
    async getDoc(p){ const s = await fs.doc(base + p).get(); return s.exists ? s.data() : null; },
    async addDoc(c, v){ const r = await fs.collection(base + c).add(v); return r.id; },
    deleteDoc:(p) => fs.doc(base + p).delete(),
    watchDoc(p, cb){ return fs.doc(base + p).onSnapshot(s => { state.connErr = ''; cb(s.exists ? s.data() : null); }, onErr); },
    watchColl(c, field, n, cb){
      return fs.collection(base + c).orderBy(field, 'desc').limit(n)
        .onSnapshot(s => cb(s.docs.map(d => Object.assign({ id:d.id }, d.data()))), onErr);
    }
  };
}
async function write(fn, okMsg){
  if (!store){ toast('Still loading. Try again in a moment.'); return false; }
  try{ await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if (code === 'permission-denied') toast('Not allowed to save. Check the database rules in the setup notes.');
    else if (code === 'resource-exhausted') toast('Too many saves at once. Wait a few seconds and try again.');
    else toast(READONLY_MSG);
    return false;
  }
}
async function connect(){
  const cfg = window.FIREBASE_CONFIG || {};
  if (!cfg.apiKey || !window.firebase) return null;
  try{
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    return firebase.firestore();
  }catch(e){
    console.error(e);
    state.connErr = 'Couldn\u2019t connect. Check the setup steps (config and anonymous sign-in).';
    return null;
  }
}

function skyFor(hour){
  if (hour < 5)  return { bg:'linear-gradient(165deg,#15122B 0%,#2D2652 100%)', ink:'#EEE9F8' };
  if (hour < 8)  return { bg:'linear-gradient(165deg,#F2B08E 0%,#A894D2 100%)', ink:'#2A1830' };
  if (hour < 17) return { bg:'linear-gradient(165deg,#9FCBEA 0%,#E7F1F8 100%)', ink:'#1C2738' };
  if (hour < 20) return { bg:'linear-gradient(165deg,#B4542A 0%,#5B3D86 100%)', ink:'#FFF5EA' };
  return { bg:'linear-gradient(165deg,#2A2450 0%,#4C3A70 100%)', ink:'#EEE9F8' };
}
function statusText(p){

function skyPanel(p){

function pauseIsLive(){ return !!(state.pause && state.pause.active && state.pause.until); }
function bridge(){
  const p = state.pause;
  if (state.phase === 'app' && pauseIsLive()){
    const who = p.by, overdue = Date.now() > Date.parse(p.until);
    const txt = overdue ? PEOPLE[who].name + '\u2019s pause time is up.' : PEOPLE[who].name + ' is on a pause until ' + dualFor(p.until, who) + '.';
    return h('div', { class:'bridge paused' }, h('strong', { text:'Pause. ' }), txt);
  }
  if (state.phase === 'app' && p && !p.active && p.endedAt && Date.now() - Date.parse(p.endedAt) < 12*3600e3){
    return h('div', { class:'bridge' }, PEOPLE[p.by].name + ' came back ' + ago(p.endedAt) + '. Ready to talk.');
  }
  if (sameCity()) return h('div', { class:'bridge' }, 'Same city, same sky.');
  const off = (tzOffsetMin(ZONES.kochi, new Date()) - tzOffsetMin(ZONES.milan, new Date())) / 60;
  const hrs = Math.floor(Math.abs(off)), mins = Math.round((Math.abs(off) - hrs) * 60);
  return h('div', { class:'bridge' }, hrs + ' h' + (mins ? ' ' + mins + ' min' : '') + ' apart. Not for long.');
}
function renderSkies(){
  const el = document.getElementById('skies');

  el.replaceChildren(skyPanel('sudipt'), skyPanel('nayana'), bridge());
}

/* ---------- PIN lock ---------- */
let lastActive = Date.now(), hiddenAt = 0;
function touch(){ lastActive = Date.now(); }
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, touch, { passive:true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else { if (hiddenAt && Date.now() - hiddenAt > 2*60e3) lockAll(); hiddenAt = 0; }
});
function checkIdle(){ if (Object.keys(state.unlocked).length && Date.now() - lastActive > 5*60e3) lockAll(); }
function lockAll(){
  if (!Object.keys(state.unlocked).length) return;
  state.unlocked = {}; state.notes = { sudipt:[], nayana:[] }; state.pin = null;
  state.d = { sudipt:newDraft(), nayana:newDraft() };
  renderAll();
}
function openPersonSpace(p){
  if (state.view && state.view !== p) lockAll();
  Object.keys(state.unlocked).forEach(k => { if (k !== p) delete state.unlocked[k]; });
  state.view = p; state.pin = null; renderAll(); window.scrollTo({ top:0 });
}
function leaveSpace(){ state.view = null; lockAll(); renderAll(); window.scrollTo({ top:0 }); }
function pinState(p){
  if (!state.pin || state.pin.person !== p) state.pin = { person:p, a:'', b:'', err:'', busy:false, fails:0, until:0, reset:false };
  return state.pin;
}
async function loadNotes(p){
  let rec = null;
  try{ rec = await store.getDoc('notes/' + p); }catch(e){}
  if (!rec || !rec.ct){ state.notes[p] = []; return; }
  try{ state.notes[p] = (await decryptJSON(state.unlocked[p].key, rec)).items || []; }
  catch(e){ state.notes[p] = []; toast('Couldn\u2019t open your notes with this PIN.'); }
}
async function saveNotes(p, items, msg){
  if (!state.unlocked[p]) return false;
  const rec = await encryptJSON(state.unlocked[p].key, { items });
  const ok = await write(() => store.setDoc('notes/' + p, Object.assign(rec, { at:nowISO() })), msg);
  if (ok) state.notes[p] = items;
  return ok;
}
async function unlock(p){
  const s = pinState(p);
  if (Date.now() < s.until){ s.err = 'Too many tries. Wait a moment.'; renderMain(); return; }
  if (!/^\d{4,8}$/.test(s.a)){ s.err = 'Enter your 4 to 8 digit PIN.'; renderMain(); return; }
  s.busy = true; s.err = ''; renderMain();
  try{
    const rec = state.pins[p];
    const r = await derive(s.a, rec.salt);
    if (r.verifier !== rec.verifier){
      s.fails++; s.a = ''; s.err = 'That PIN doesn\u2019t match.';
      if (s.fails >= 5){ s.until = Date.now() + 30000; s.fails = 0; s.err = 'Too many tries. Try again in 30 seconds.'; }
    } else {
      state.unlocked[p] = { key:r.key }; state.d[p] = newDraft(); lsSet('os-me', p);
      await loadNotes(p); state.pin = null; touch();
    }
  }catch(e){ s.err = 'This browser couldn\u2019t check the PIN. Try another browser.'; }
  if (state.pin) state.pin.busy = false;
  renderAll();
}
async function setPin(p){
  const s = pinState(p);
  if (!/^\d{4,8}$/.test(s.a)){ s.err = 'Use 4 to 8 digits. Six is safer.'; renderMain(); return; }
  if (s.a !== s.b){ s.err = 'The two PINs don\u2019t match.'; s.b = ''; renderMain(); return; }
  s.busy = true; renderMain();
  try{
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    const r = await derive(s.a, salt);
    const ok = await write(() => store.setDoc('pins/' + p, { salt, verifier:r.verifier, at:nowISO() }));
    if (ok){
      state.pins[p] = { salt, verifier:r.verifier }; state.unlocked[p] = { key:r.key };
      state.notes[p] = []; state.pin = null; state.d[p] = newDraft(); lsSet('os-me', p); touch();
      toast('PIN set. Your space is ready.');
    }
  }catch(e){ s.err = 'This browser couldn\u2019t set a PIN. Try another browser.'; }
  if (state.pin) state.pin.busy = false;
  renderAll();
}
async function resetPin(p){
  const ok = await write(async () => { await store.deleteDoc('notes/' + p); await store.deleteDoc('pins/' + p); });
  if (ok){ state.pins[p] = null; state.notes[p] = []; state.pin = null; toast('PIN cleared. Set a new one.'); }
  renderAll();
}
async function changePin(p){
  const d = state.d[p];
  if (!/^\d{4,8}$/.test(d.newPin)){ toast('Use 4 to 8 digits for the new PIN.'); return; }
  if (d.newPin !== d.newPin2){ toast('The two new PINs don\u2019t match.'); return; }
  try{
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
    const r = await derive(d.newPin, salt);
    const rec = await encryptJSON(r.key, { items:state.notes[p] });
    const ok = await write(async () => {
      await store.setDoc('pins/' + p, { salt, verifier:r.verifier, at:nowISO() });
      await store.setDoc('notes/' + p, Object.assign(rec, { at:nowISO() }));
    }, 'PIN changed.');
    if (ok){ state.unlocked[p] = { key:r.key }; state.pins[p] = { salt, verifier:r.verifier }; d.newPin = ''; d.newPin2 = ''; d.showPinChange = false; renderMain(); }
  }catch(e){ toast('Couldn\u2019t change the PIN on this browser.'); }
}

/* ---------- notifications ---------- */
const NOTIF_TYPES = [['pause','Pauses'], ['thanks','Thank-yous'], ['calendar','New dates'], ['promises','Promises'], ['daily','Anniversary and day reminders'], ['checkins','Check-ins']];
function defaultPrefs(){ return { pause:true, thanks:true, calendar:true, promises:true, daily:true, checkins:false }; }
const notif = { deviceId:null, person:null, prefs:defaultPrefs(), busy:false, err:'', loaded:false, listening:false };
function isIOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); }
function pushSupport(){
  const has = ('serviceWorker' in navigator) && ('Notification' in window) && ('PushManager' in window);
  if (!has) return (isIOS() && !isStandalone()) ? 'ios-browser' : 'unsupported';
  if (isIOS() && !isStandalone()) return 'ios-browser';
  if (state.mode !== 'synced' || !window.firebase || !firebase.messaging || !window.FIREBASE_VAPID_KEY) return 'not-configured';
  return 'ok';
}
async function sha256hex(t){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2,'0')).join('');
}
function appBaseUrl(){ return location.origin + location.pathname.replace(/[^/]*$/, ''); }
async function swRegistration(){
  const url = 'firebase-messaging-sw.js?c=' + encodeURIComponent(JSON.stringify(window.FIREBASE_CONFIG));
  await navigator.serviceWorker.register(url, { scope:'./' });
  return navigator.serviceWorker.ready;
}
function listenForeground(){
  if (notif.listening || pushSupport() !== 'ok' || Notification.permission !== 'granted') return;
  try{
    firebase.messaging().onMessage(m => { const n = (m && m.notification) || {}; toast((n.title || 'Our Space') + (n.body ? ': ' + n.body : '')); });
    notif.listening = true;
  }catch(e){}
}
async function loadDevice(){
  notif.deviceId = lsGet('os-device'); notif.loaded = true;
  if (!notif.deviceId || !store) return;
  try{
    const d = await store.getDoc('devices/' + notif.deviceId);
    if (!d){ lsDel('os-device'); notif.deviceId = null; return; }
    notif.person = d.person || null; notif.prefs = Object.assign(defaultPrefs(), d.prefs || {});
  }catch(e){}
  listenForeground();
}
async function enableNotifications(p){
  notif.busy = true; notif.err = ''; renderMain();
  try{
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){
      notif.err = perm === 'denied' ? 'Notifications are blocked. Turn them on in Settings \u2192 Notifications \u2192 Our Space.' : 'Notifications weren\u2019t allowed.';
      return;
    }
    const reg = await swRegistration();
    const token = await firebase.messaging().getToken({ vapidKey:window.FIREBASE_VAPID_KEY, serviceWorkerRegistration:reg });
    if (!token) throw new Error('no token');
    const id = (await sha256hex(token)).slice(0, 32);
    const prefs = Object.assign(defaultPrefs(), notif.prefs || {});
    if (notif.deviceId && notif.deviceId !== id){ try{ await store.deleteDoc('devices/' + notif.deviceId); }catch(e){} }
    await store.setDoc('devices/' + id, { person:p, token, prefs, at:nowISO() });
    if (state.settings.appUrl !== appBaseUrl()){ try{ await store.updateDoc('couple/settings', { appUrl:appBaseUrl() }); }catch(e){} }
    lsSet('os-device', id); notif.deviceId = id; notif.person = p; notif.prefs = prefs;
    listenForeground();
    toast('Notifications are on for this phone.');
  }catch(e){
    console.error(e);
    notif.err = 'Couldn\u2019t turn on notifications. Check the setup notes, then try again.';
  }finally{ notif.busy = false; renderMain(); }
}
async function setPref(k, v){
  notif.prefs = Object.assign({}, notif.prefs, { [k]:v }); renderMain();
  await write(() => store.updateDoc('devices/' + notif.deviceId, { prefs:{ [k]:v } }));
}
async function disableNotifications(){
  const id = notif.deviceId; if (!id) return;
  try{ const reg = await navigator.serviceWorker.getRegistration('./'); if (reg) await firebase.messaging().deleteToken(); }catch(e){}
  await write(() => store.deleteDoc('devices/' + id), 'Notifications are off for this phone.');
  lsDel('os-device'); notif.deviceId = null; notif.person = null; renderMain();
}
function notifBlock(p){
  const sup = pushSupport();
  const head = [h('h2', { text:'Notifications' }), h('p', { class:'lead', text:'Get a ping on this phone when something happens between you two.' })];
  let body;
  if (sup === 'ios-browser') body = h('p', { class:'muted', text:'Open Our Space from its home screen icon to turn these on. iPhone only allows notifications there.' });
  else if (sup === 'unsupported') body = h('p', { class:'muted', text:'This browser can\u2019t receive notifications.' });
  else if (sup === 'not-configured') body = h('p', { class:'muted', text:'Notifications aren\u2019t set up yet.' });
  else if (Notification.permission === 'denied') body = h('p', { class:'muted', text:'Notifications are blocked for Our Space. Turn them on in Settings \u2192 Notifications \u2192 Our Space.' });
  else if (!notif.deviceId || Notification.permission !== 'granted') body = h('div', {},
      h('button', { class:'btn', disabled:notif.busy, onclick: () => enableNotifications(p) }, notif.busy ? 'Turning on\u2026' : 'Turn on notifications'),
      h('p', { class:'err', role:'alert', text:notif.err }));
  else if (notif.person && notif.person !== p) body = h('div', {},
      h('p', { class:'muted', style:'margin-bottom:10px', text:'This phone gets ' + PEOPLE[notif.person].name + '\u2019s notifications.' }),
      h('button', { class:'btn secondary', disabled:notif.busy, onclick: () => enableNotifications(p) }, 'Send them to me instead'));
  else body = h('div', {},
      h('span', { class:'label', id:'lbl-notif', text:'Tell me about' }),
      h('div', { class:'chips', role:'group', 'aria-labelledby':'lbl-notif' },
        NOTIF_TYPES.map(([k, label]) => h('button', { class:'chip', 'aria-pressed': notif.prefs[k] ? 'true' : 'false', onclick: () => setPref(k, !notif.prefs[k]) }, label))),
      h('p', { class:'muted small', style:'margin-top:10px', text:'You\u2019ll only hear about things ' + PEOPLE[other(p)].name + ' does, never your own.' }),
      h('button', { class:'linkish small', style:'margin-top:10px', onclick: disableNotifications }, 'Turn off on this phone'));
  return h('section', { class:'block' }, head, body);
}

/* ---------- personal tips ---------- */
function partnerHint(c, partner){
  const pr = PEOPLE[partner];
  const map = {
    heard:'Ask about ' + pr.his + ' day, then listen. Reflect back before adding anything.',
    space:'Give ' + pr.him + ' room. One short, kind message is plenty.',
    reassure:'Say it plainly: you love ' + pr.him + ' and you\u2019re not going anywhere.',
    help:'Ask what would help most, then do that one thing.',
    fun:'Send something silly, or plan something small for later.'
  };
  const lines = [];
  if (map[c.need]) lines.push(map[c.need]);
  if (c.energy === 'lowcap' || c.energy === 'low') lines.push('Save non-urgent topics for another day, and be extra gentle.');
  return lines.join(' ');
}
function tipsFor(p){
  const o = other(p), O = PEOPLE[o], now = Date.now(), live = [], daily = [];
  const pz = state.pause;
  if (pauseIsLive() && pz.by === o){
    live.push(now > Date.parse(pz.until)
      ? O.name + '\u2019s return time has passed. One gentle check-in is fine.'
      : O.name + ' is on a pause until ' + dualFor(pz.until, o, p) + '. No chasing. Calm down too, and write in your notes if it helps.');
  }
  if (pauseIsLive() && pz.by === p && now > Date.parse(pz.until)) live.push('Your return time has passed. Reach out now, even just to ask for one more hour.');
  const oc = latestCheckin(o), mc = latestCheckin(p);
  const pd = parts(new Date(), tzOf(p)), tmr = parts(new Date(Date.now() + 864e5), tzOf(p));
  if (pd.d === 3) live.push('Happy anniversary. Make time for each other today, even if it\u2019s just a proper call.');
  else if (tmr.d === 3) live.push('Your anniversary is tomorrow, the 3rd. Plan something small for ' + O.him + '.');
  const todayKey = dateKey(tzOf(p));
  occurrencesOn(todayKey).filter(x => !x.anniv).slice(0, 2)
    .forEach(x => live.push('On the calendar today: ' + x.title + (x.time ? ', ' + eventTimeText(x, todayKey) : '') + (x.for !== 'both' ? ' (' + forLabel(x.for) + ')' : '') + '.'));
  const partnerPaused = pauseIsLive() && pz.by === o && now <= Date.parse(pz.until);
  if (oc && !partnerPaused){ const t = partnerHint(oc, o); if (t) live.push(O.name + ' needs ' + (needOf(oc.need) ? needOf(oc.need).phrase : 'care') + ' today. ' + t); }
  if (!mc) live.push('Do your check-in so ' + O.name + ' doesn\u2019t have to guess how you are.');
  else if (mc.energy === 'low' || mc.energy === 'lowcap') live.push('You\u2019re running low. Say so plainly, so it doesn\u2019t come out as frustration.');
  const overdue = state.promises.filter(x => x.by === p && x.status === 'open' && x.due && Date.parse(x.due) < now);
  if (overdue.length) live.push('You have ' + overdue.length + ' promise' + (overdue.length > 1 ? 's' : '') + ' past due. Keep it, or tell ' + O.him + ' honestly what got in the way.');
  const sent = state.apps.filter(a => a.from === p && Date.parse(a.at) > now - 7*864e5).length;
  if (!sent) live.push('You haven\u2019t sent ' + O.name + ' a thank-you this week. Small and specific counts.');
  if (pd.wd === 'Sun') live.push('It\u2019s Sunday: time for your 20-minute check-in. The steps are under Talk.');
  const pool = TIPS[p], day = Math.floor(now / 864e5);
  const i1 = day % pool.length, i2 = (day * 5 + 7) % pool.length;
  daily.push(pool[i1]); if (i2 !== i1) daily.push(pool[i2]);
  return { live:live.slice(0, 5), daily };
}
function tipsBlock(p){
  const t = tipsFor(p);
  return h('section', { class:'block' },
    h('h2', { text:'For you today' }),
    h('ul', { class:'tips' },
      t.live.map(x => h('li', { class:'now', text:x })),
      t.daily.map(x => h('li', { text:x }))
    ),
    h('details', { style:'margin-top:8px' },
      h('summary', { text:'All my tips' }),
      h('ul', { class:'tips' }, TIPS[p].map(x => h('li', { text:x })))
    )
  );
}

/* ---------- pause ---------- */
function pauseOptions(p){
  const tz = tzOf(p), now = Date.now(), opts = [];
  opts.push({ k:'1h', label:'1 hour', at:new Date(now + 3600e3) });
  opts.push({ k:'3h', label:'3 hours', at:new Date(now + 3*3600e3) });
  const tonight = zonedAt(tz, 0, 21, 0);
  if (tonight.getTime() > now + 45*60e3) opts.push({ k:'tonight', label:'Tonight, 9 pm', at:tonight });
  const morning = zonedAt(tz, 1, 10, 0);
  if (morning.getTime() - now <= 24*3600e3) opts.push({ k:'morning', label:'Tomorrow, 10 am', at:morning });
  opts.push({ k:'custom', label:'Pick a time', at:null });
  return opts;
}
function pickedPauseTime(p){
  const d = state.d[p], o = pauseOptions(p).find(x => x.k === d.pauseOpt);
  if (!o) return null;
  if (o.k === 'custom'){ const t = Date.parse(d.pauseCustom); return isFinite(t) ? new Date(t) : null; }
  return o.at;
}
async function startPause(p){
  const d = state.d[p], at = pickedPauseTime(p);
  if (!at){ toast('Pick when you\u2019ll be back.'); return; }
  const now = Date.now(); let u = at.getTime(), capped = false;
  if (u < now + 10*60e3){ toast('Pick a time at least 10 minutes away.'); return; }
  if (u > now + 24*3600e3){ u = now + 24*3600e3; capped = true; }
  const ok = await write(() => store.setDoc('couple/pause', {
    active:true, by:p, until:new Date(u).toISOString(), note:(d.pauseNote || '').trim().slice(0, 240), startedAt:nowISO()
  }));
  if (ok){
    d.pauseNote = ''; d.pauseOpt = null; d.pauseCustom = '';
    toast(capped ? 'Pause started, capped at 24 hours.' : 'Pause started. ' + PEOPLE[other(p)].name + ' can see when you\u2019ll be back.');
  }
}
async function endPause(p){
  const z = state.pause || {};
  await write(() => store.setDoc('couple/pause', { active:false, by:z.by || p, until:z.until || null, startedAt:z.startedAt || null, endedAt:nowISO() }), 'You\u2019re back. Time to talk.');
}
async function extendPause(){
  const z = state.pause; if (!z) return;
  const now = Date.now(), until = Date.parse(z.until), lim = Date.parse(z.startedAt) + 24*3600e3;
  const base = Math.max(until, now), u = Math.min(base + 3600e3, lim);
  if (u <= base){ toast('A pause can\u2019t run past 24 hours. Reach out now, even briefly.'); return; }
  await write(() => store.updateDoc('couple/pause', { until:new Date(u).toISOString(), reminded:false }), 'Added an hour.');
}
function copyText(txt, msg){
  const fail = () => toast('Copy didn\u2019t work here. Type it instead.');
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(() => toast(msg || 'Copied.'), fail); return; }
  }catch(e){}
  fail();
}

      h('input', { class:'field', id:'pause-note', maxlength:'240', placeholder:'Not leaving, just calming down', value:d.pauseNote,
        oninput: e => { d.pauseNote = e.target.value; } })),
    h('div', { class:'row', style:'margin-top:14px' },
      h('button', { class:'btn pause', onclick: () => startPause(me), disabled: !d.pauseOpt }, 'Start pause'),

const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function localYMD(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function ymdParts(ds){ const a = ds.split('-').map(Number); return { y:a[0], m:a[1], d:a[2] }; }
function addDays(ds, n){ const p = ymdParts(ds); return localYMD(new Date(p.y, p.m-1, p.d+n)); }

function calState(){
  if (!state.cal){ const t = localYMD(), p = ymdParts(t); state.cal = { y:p.y, m:p.m, sel:t, f:newEventDraft(), confirmDel:null }; }
  return state.cal;
}
function occurrencesOn(ds){
  const out = [];
  if (ds.slice(8) === '03') out.push({ anniv:true, title:'Our anniversary' });
  for (const e of state.events){
    if (!e.date) continue;
    if (e.date === ds || (e.repeat === 'yearly' && e.date.slice(5) === ds.slice(5) && ds > e.date)) out.push(e);
  }
  out.sort((a, b) => a.anniv ? -1 : b.anniv ? 1 : (a.time || '99').localeCompare(b.time || '99'));
  return out;
}
function upcoming(n, days){
  const out = []; let ds = localYMD();
  for (let i = 0; i < days && out.length < n; i++){ for (const o of occurrencesOn(ds)) out.push({ o, ds }); ds = addDays(ds, 1); }
  return out.slice(0, n);
}

  if (!e.time) return 'All day';
  const city = e.city === 'kochi' ? 'kochi' : 'milan', tz = ZONES[city];
  const p = ymdParts(ds), t = e.time.split(':').map(Number);
  const guess = Date.UTC(p.y, p.m-1, p.d, t[0], t[1]);
  const at = new Date(guess - tzOffsetMin(tz, new Date(guess)) * 60000);
  if (sameCity()) return clock(at, ZONES[cityOf('sudipt')]);
  const oc = city === 'milan' ? 'kochi' : 'milan';
  return clock(at, tz) + ' ' + CITY_NAME[city] + ' (' + clock(at, ZONES[oc]) + ' ' + CITY_NAME[oc] + ')';

      h('div', { class:'ev-when', text: countdown(daysUntil(ds)) }),
      h('div', { class:'ev-body' },
        h('p', { class:'ev-title' }, o.anniv ? h('span', { class:'cal-heart big', 'aria-hidden':'true', text:'\u2665 ' }) : null, o.title),
        h('div', { class:'meta', text: prettyDate(ds, { weekday:'short', day:'numeric', month:'short' }) + (o.anniv ? '' : ', ' + eventTimeText(o, ds) + ', ' + forLabel(o.for)) })))))
      : h('p', { class:'empty', text:'Nothing in the next two months.' }),
    h('button', { class:'linkish small', style:'margin-top:8px', onclick: () => { state.tab = 'cal'; renderAll(); window.scrollTo({ top:0 }); } }, 'Open calendar')
  );
}

/* ---------- talk ---------- */
async function saveTalk(){
  const t = state.talk;
  if (!t.topic.trim()){ toast('Add what the talk was about.'); return; }
  const ok = await write(() => store.addDoc('talks', {
    topic:t.topic.trim().slice(0,160),
    understood:{ sudipt:t.us.trim().slice(0,400), nayana:t.un.trim().slice(0,400) },
    will:{ sudipt:t.ws.trim().slice(0,400), nayana:t.wn.trim().slice(0,400) },
    at:nowISO()
  }), 'Saved to your log. Well done, both of you.');
  if (ok){ state.talk = { topic:'', us:'', un:'', ws:'', wn:'' }; state.talkStep = 0; state.speaker = null; renderMain(); }
}
function talkField(id, key, label, multi){
  const props = { class:'field', id, value:state.talk[key], oninput: e => { state.talk[key] = e.target.value; } };
  return h('div', {}, h('label', { class:'label', for:id, text:label }), multi ? h('textarea', Object.assign({ maxlength:'400' }, props)) : h('input', Object.assign({ maxlength:'160' }, props)));
}
function talkSteps(){
  const sp = state.speaker, li = sp ? other(sp) : null;
  const S = sp ? PEOPLE[sp].name : 'The speaker', L = li ? PEOPLE[li].name : 'The listener';
  return [
    { title:'Before you start', body:[
      h('ul', {},
        h('li', { text:'On a call or in person, never over text.' }),
        h('li', { text:'One topic only. Old fights stay out.' }),
        h('li', { text:'Not after 11 pm for either of you.' }),
        h('li', { text:'About 20 minutes for the first round.' })),
      h('p', { style:'margin-top:14px;font-weight:600', text:'Who\u2019s more upset? They speak first.' }),
      h('div', { class:'chips', style:'margin-top:8px' },
        ['sudipt','nayana'].map(p => h('button', { class:'chip', 'aria-pressed': sp === p ? 'true' : 'false', onclick: () => { state.speaker = p; renderMain(); } }, PEOPLE[p].name)))
    ]},
    { title:S + ' shares', body:[
      h('div', { class:'say' }, h('b', { text:S + ': ' }), '\u201cI feel ___ about ___, and what I need is ___.\u201d'),
      h('p', { text:L + ' just listens. No defending, no examples, no fixing yet.' })
    ]},
    { title:L + ' reflects back', body:[
      h('div', { class:'say' }, h('b', { text:L + ': ' }), '\u201cSo you felt ___ when ___. Did I get that right?\u201d'),
      h('div', { class:'say' }, h('b', { text:L + ': ' }), '\u201cIs there more?\u201d'),
      h('p', { text:'Keep going until ' + S + ' says \u201cyes, that\u2019s it.\u201d' })
    ]},
    { title:'Ask before helping', body:[
      h('div', { class:'say' }, h('b', { text:L + ': ' }), '\u201cDo you want ideas, or do you just want me to listen?\u201d'),
      h('p', { text:'Then do what ' + S + ' asks for.' })
    ]},
    { title:'Switch', body:[
      h('p', { text:L + ' now shares ' + (li ? PEOPLE[li].his : 'their') + ' side the same way, and ' + S + ' reflects it back.' }),
      h('p', { class:'muted', style:'margin-top:8px', text:'If it heats up again, either of you can call a pause with a return time.' })
    ]},
    { title:'Close it', body:[
      h('p', { class:'muted', style:'margin-bottom:12px', text:'Each of you says one thing you understood and one thing you\u2019ll do differently.' }),
      h('div', { class:'stack' },
        talkField('t-topic', 'topic', 'What was it about?', false),
        talkField('t-us', 'us', 'What Sudipt understood', true),
        talkField('t-un', 'un', 'What Nayana understood', true),
        talkField('t-ws', 'ws', 'What Sudipt will do differently', true),
        talkField('t-wn', 'wn', 'What Nayana will do differently', true),
        h('div', { class:'row' }, h('button', { class:'btn', onclick: saveTalk }, 'Save to our log')))
    ]}
  ];
}
function talkView(){
  const steps = talkSteps(), i = Math.min(state.talkStep, steps.length - 1), st = steps[i];
  const go = n => { state.talkStep = Math.max(0, Math.min(steps.length - 1, n)); renderMain(); };
  return h('div', {},
    h('section', { class:'block' },
      h('h2', { text:'Talk it through' }),
      h('p', { class:'lead', text:'Open this on your call when something needs sorting. It walks you through it step by step.' }),
      h('div', { class:'step-card' },
        h('div', { class:'step-count', text:'Step ' + (i + 1) + ' of ' + steps.length }),
        h('h3', { text:st.title }),
        h('div', { style:'margin-top:8px' }, st.body),
        h('div', { class:'row', style:'margin-top:16px;justify-content:space-between' },
          h('button', { class:'btn secondary small', onclick: () => go(i - 1), disabled: i === 0 }, 'Back'),
          i < steps.length - 1 ? h('button', { class:'btn small', onclick: () => go(i + 1), disabled: i === 0 && !state.speaker }, 'Next') : null))),
    h('section', { class:'block details-block' },
      h('details', {},
        h('summary', { text:'Swap these lines' }),
        h('div', { class:'swap-wrap' }, h('table', { class:'swap' },
          h('thead', {}, h('tr', {}, h('th', { text:'Instead of' }), h('th', { text:'Try' }))),
          h('tbody', {}, SWAPS.map(([a, b]) => h('tr', {}, h('td', { text:a }), h('td', { text:b }))))))),
      h('details', {},
        h('summary', { text:'Sunday check-in, 20 minutes' }),
        h('ol', {},
          h('li', { text:'Three specific appreciations each.' }),
          h('li', { text:'One thing we handled well together this week.' }),
          h('li', { text:'One request for next week, as a need, not a complaint.' }),
          h('li', { text:'Anything left over from a pause.' }),
          h('li', { text:'Next date: when, and whose turn to plan.' }))),
      h('details', {},
        h('summary', { text:'Apologies that land' }),
        h('ol', {},
          h('li', { text:'Name what you did, specifically.' }),
          h('li', { text:'Name how it likely felt for them.' }),
          h('li', { text:'Own it. No \u201cbut\u201d, no counter-complaint.' }),
          h('li', { text:'Say the one thing you\u2019ll do differently, then do it for 30 days.' })),
        h('p', { class:'muted small', style:'margin-top:8px', text:'Receiving one: \u201cThank you, I accept it,\u201d even if you need time to feel better.' }))),
    h('section', { class:'block talk-log' },
      h('h2', { text:'Our log' }),
      state.talks.length ? h('ul', { class:'feed boxed' }, state.talks.map(t => h('li', {},
        h('div', { class:'meta', text:ago(t.at) }),
        h('h3', { text:t.topic }),
        h('dl', {},
          (t.understood && t.understood.sudipt) ? [h('dt', { text:'Sudipt understood' }), h('dd', { text:t.understood.sudipt })] : null,
          (t.understood && t.understood.nayana) ? [h('dt', { text:'Nayana understood' }), h('dd', { text:t.understood.nayana })] : null,
          (t.will && t.will.sudipt) ? [h('dt', { text:'Sudipt will' }), h('dd', { text:t.will.sudipt })] : null,
          (t.will && t.will.nayana) ? [h('dt', { text:'Nayana will' }), h('dd', { text:t.will.nayana })] : null))))
        : h('p', { class:'empty', text:'Talks you close will be logged here, so you can see the progress.' }))
  );
}

/* ---------- setup ---------- */
async function enterCode(code){
  const c = normCode(code);
  if (c.split('-').length < 3 || c.length < 12){ state.setup.err = 'That code looks too short. Check it and try again.'; renderSetup(); return; }
  lsSet('os-code', c); await openSpace(c);
}
function renderSetup(){
  const root = document.getElementById('overlay-root'), s = state.setup;
  if (state.phase !== 'setup'){ root.replaceChildren(); return; }
  let body;
  if (s.stage === 'created'){
    body = [
      h('h1', { id:'setup-title', text:'Your shared code' }),
      h('p', { class:'muted', text:'Send this to your partner privately. You\u2019ll each enter it once, and the app remembers it on that phone.' }),
      h('div', { class:'code', text:s.newCode }),
      h('button', { class:'btn secondary', onclick: () => copyText(s.newCode, 'Code copied.') }, 'Copy code'),
      h('button', { class:'btn', onclick: () => enterCode(s.newCode) }, 'Continue')
    ];
  } else if (s.stage === 'join'){
    body = [
      h('h1', { id:'setup-title', text:'Enter your code' }),
      h('p', { class:'muted', text:'The code looks like four words and a number.' }),
      h('input', { class:'field', id:'join-code', style:'margin-top:14px', autocomplete:'off', autocapitalize:'off', spellcheck:'false', placeholder:'word-word-word-word-1234', value:s.joinCode,
        oninput: e => { s.joinCode = e.target.value; }, onkeydown: e => { if (e.key === 'Enter') enterCode(s.joinCode); } }),
      h('p', { class:'err', text:s.err }),
      h('button', { class:'btn', onclick: () => enterCode(s.joinCode) }, 'Join'),
      h('button', { class:'btn secondary', onclick: () => { s.stage = 'choose'; s.err = ''; renderSetup(); } }, 'Back')
    ];
  } else {
    body = [
      h('h1', { id:'setup-title', text:'Our Space' }),
      h('p', { class:'muted', text:'A shared place for pauses, check-ins, thank-yous and promises. Start a new space, or join with the code you were sent.' }),
      h('button', { class:'btn', onclick: () => { s.newCode = genCode(); s.stage = 'created'; renderSetup(); } }, 'Start a new space'),
      h('button', { class:'btn alt', onclick: () => { s.stage = 'join'; renderSetup(); } }, 'I have a code')
    ];
  }
  root.replaceChildren(h('div', { class:'overlay', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'setup-title' }, h('div', { class:'picker' }, body)));
  const f = root.querySelector('#join-code') || root.querySelector('button'); if (f) f.focus();
}

/* ---------- chrome ---------- */
const TABS = [['us','Us'], ['cal','Calendar'], ['thanks','Thanks'], ['promises','Promises'], ['talk','Talk']];
function renderTabs(){
  const nav = document.getElementById('tabs');
  if (state.phase !== 'app' || state.view){ nav.replaceChildren(); nav.hidden = true; return; }
  nav.hidden = false;
  nav.replaceChildren(...TABS.map(([k, label]) => h('button', {
    class:'tab', role:'tab', id:'tab-' + k, 'aria-selected': state.tab === k ? 'true' : 'false', 'aria-controls':'main',
    onclick: () => { state.tab = k; renderAll(); window.scrollTo({ top:0 }); } }, label)));
}
function renderNotices(){
  const n = [];
  if (state.connErr) n.push(h('div', { class:'notice' }, state.connErr));
  else if (state.phase === 'app' && state.mode === 'local') n.push(h('div', { class:'notice' }, 'Not connected yet, so entries are saved on this phone only.'));
  document.getElementById('notices').replaceChildren(...n);
}
async function setNayanaCity(c){
  if (cityOf('nayana') === c) return;
  await write(() => store.setDoc('couple/settings', Object.assign({}, state.settings, { nayanaCity:c })), c === 'milan' ? 'Welcome to Milan, Nayana.' : 'Updated.');
}
function renderFooter(){
  const f = document.getElementById('footer');
  if (state.phase !== 'app' || state.view){ f.replaceChildren(); return; }
  f.replaceChildren(
    h('div', {}, 'Nayana is in ',
      h('span', { class:'seg', role:'group', 'aria-label':'Nayana\u2019s city' },
        ['kochi','milan'].map(c => h('button', { 'aria-pressed': cityOf('nayana') === c ? 'true' : 'false', onclick: () => setNayanaCity(c) }, CITY_NAME[c])))),
    h('div', {}, 'Shared code: ',
      state.showCode ? h('span', { text:state.code + ' ' }) : null,
      h('button', { class:'linkish', onclick: () => { state.showCode = !state.showCode; renderFooter(); } }, state.showCode ? 'Hide' : 'Show')),
    h('div', {}, h('button', { class:'linkish', onclick: () => {
      if (!confirm('Remove this space from this phone? Nothing is deleted; you can rejoin with the code.')) return;
      lsDel('os-code'); unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
      state.phase = 'setup'; state.setup = { stage:'choose', newCode:'', joinCode:'', err:'' }; state.unlocked = {}; state.view = null; renderAll();
    } }, 'Remove this space from this phone'))
  );
}

/* ---------- render ---------- */
function renderMain(){
  const main = document.getElementById('main');
  if (state.phase !== 'app'){ main.replaceChildren(); return; }
  const ae = document.activeElement, id = ae && ae.id; let ss = null, se = null;
  try{ ss = ae.selectionStart; se = ae.selectionEnd; }catch(e){}
  let view;
  if (state.view) view = state.unlocked[state.view] ? spaceView(state.view) : pinView(state.view);
  else if (state.tab === 'cal') view = calendarView();
  else if (state.tab === 'thanks') view = thanksView();
  else if (state.tab === 'promises') view = promisesView();
  else if (state.tab === 'talk') view = talkView();
  else view = usView();
  main.replaceChildren(view);
  if (id){ const el = document.getElementById(id); if (el && el !== document.activeElement){ try{ el.focus({ preventScroll:true }); if (ss != null && el.setSelectionRange) el.setSelectionRange(ss, se); }catch(e){} } }
}
let raf = 0;
function renderAll(){
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => { renderSkies(); renderTabs(); renderNotices(); renderMain(); renderFooter(); renderSetup(); });
}

/* ---------- init ---------- */
async function openSpace(code){
  unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = [];
  state.code = code; state.sid = await spaceId(code);
  store = fsdb ? fsStore(fsdb, state.sid) : localStore(state.sid);
  state.pinsLoaded = { sudipt:false, nayana:false };
  unsubs.push(
    store.watchDoc('couple/settings', d => { state.settings = Object.assign({ nayanaCity:'kochi' }, d || {}); renderAll(); }),
    store.watchDoc('couple/pause', d => { state.pause = d; renderAll(); }),
    store.watchDoc('pins/sudipt', d => { state.pins.sudipt = d; state.pinsLoaded.sudipt = true; renderAll(); }),
    store.watchDoc('pins/nayana', d => { state.pins.nayana = d; state.pinsLoaded.nayana = true; renderAll(); }),
    store.watchColl('checkins', 'at', 40, r => { state.checkins = r; renderAll(); }),
    store.watchColl('appreciations', 'at', 80, r => { state.apps = r; renderAll(); }),
    store.watchColl('promises', 'at', 80, r => { state.promises = r; renderAll(); }),
    store.watchColl('talks', 'at', 40, r => { state.talks = r; renderAll(); }),
    store.watchColl('events', 'date', 500, r => { state.events = r; renderAll(); })
  );
  state.phase = 'app'; renderAll();
  loadDevice().then(renderAll);
}
async function init(){
  renderSkies();
  if (!(window.crypto && crypto.subtle)){
    document.getElementById('notices').replaceChildren(h('div', { class:'notice' }, 'This page needs to be opened over https to work.'));
    return;
  }
  fsdb = await connect();
  state.mode = fsdb ? 'synced' : 'local';
  const saved = lsGet('os-code');
  if (saved) await openSpace(saved);
  else { state.phase = 'setup'; renderAll(); }
  setInterval(() => { renderSkies(); checkIdle(); }, 30000);
}
init();
})();

</script>
</body>
